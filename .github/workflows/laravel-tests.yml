name: Laravel tests

on:
  push:
    branches:
      - feature/filament5-upgrade
  pull_request:
    branches:
      - feature/filament5-upgrade

permissions:
  contents: read

defaults:
  run:
    working-directory: ./پروژه

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Lint PHP source
        run: find app database tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run test suite
        run: php artisan test
